name: Deploy site

# - Push / daily cron / manual sync: Sync Publications runs first and this
#   workflow fires on its completion, so newly synced papers are included.
# - Pull requests: build and link-check the PR directly (no deploy), so the
#   result shows up as a check on the PR.
# - workflow_dispatch: emergency manual rebuild that bypasses the sync.
on:
  workflow_run:
    workflows: ["Sync Publications"]
    types:
      - completed
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    # Skip if sync failed or was cancelled.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Install ImageMagick 🖼️
        # apt-get update first: the runner's package index goes stale and
        # installs 404 without it.
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Check internal links 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # only check local links (images, pages) in the built site
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --no-progress '_site/**/*.html'

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
